<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — True Legacy World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'IBM Plex Sans', system-ui, sans-serif;
      background: #060b1e;
      color: #e8edf8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .container { max-width: 480px; }
    img { height: 48px; width: auto; margin-bottom: 24px; }
    h1 { font-size: clamp(1.75rem, 5vw, 2.25rem); margin: 0 0 12px; color: #fff; }
    p { color: #94a3b8; margin: 0 0 24px; line-height: 1.6; }
    a {
      display: inline-block;
      min-height: 48px;
      line-height: 48px;
      padding: 0 24px;
      background: linear-gradient(135deg, #1B3A8C 0%, #1e6fc0 100%);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      border-radius: 12px;
      transition: opacity 0.2s, transform 0.2s;
    }
    a:hover { opacity: 0.95; transform: scale(1.02); }
  </style>
</head>
<body>
  <div class="container">
    <a href="/"><img src="/logos/tl-horizontal-white.png" alt="True Legacy World" /></a>
    <h1>Page Not Found</h1>
    <p>This page doesn’t exist or has been moved. Head back to start your legacy.</p>
    <a href="/">Go Home</a>
  </div>
</body>
</html>
