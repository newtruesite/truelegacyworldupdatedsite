<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Inter:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Primary Meta Tags -->
    <title>True Legacy World | Creating True Health Around the World</title>
    <meta
      name="title"
      content="True Legacy World | Creating True Health Around the World"
    />
    <meta
      name="description"
      content="Discover True Legacy World: global Kangen Water + EMF protection community. Health, wealth, and legacy building across 51+ countries."
    />
    <meta
      name="keywords"
      content="True Legacy World, Kangen Water, EMF protection, emGuarde, global wellness, network marketing, legacy building, international distributors"
    />
    <meta name="author" content="True Legacy World" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="True Legacy World" />
    <meta
      property="og:image"
      content="https://truelegacyworld.com/logos/tl-square-white.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://truelegacyworld.com/" />
    <meta
      property="og:title"
      content="True Legacy World | Creating True Health Around the World"
    />
    <meta
      property="og:description"
      content="Discover True Legacy World: global Kangen Water + EMF protection community. Health, wealth, and legacy building across 51+ countries."
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://truelegacyworld.com/" />
    <meta
      property="twitter:image"
      content="https://truelegacyworld.com/logos/tl-square-white.png"
    />
    <meta
      property="twitter:title"
      content="True Legacy World | Creating True Health Around the World"
    />
    <meta
      property="twitter:description"
      content="Discover True Legacy World: global Kangen Water + EMF protection community. Health, wealth, and legacy building across 51+ countries."
    />

    <!-- Canonical -->
    <link rel="canonical" href="https://truelegacyworld.com/" />
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://flagcdn.com" />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />

    <!-- jsVectorMap for interactive world map -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/css/jsvectormap.min.css"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/js/jsvectormap.min.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/maps/world.js"
      defer
    ></script>
  </head>

  <body>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "True Legacy World",
        "url": "https://truelegacyworld.com",
        "logo": "https://truelegacyworld.com/assets/images/Logo%20final%20True%20Legacy_Mesa%20de%20trabajo%201%20copia%2047%20(2).png",
        "description": "Global Enagic Kangen Water distributor network. Health, wealth and legacy building in 51+ countries.",
        "sameAs": [
          "https://www.instagram.com/truelegacyworld/",
          "https://www.tiktok.com/@mehdi_cohen"
        ]
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "url": "https://truelegacyworld.com",
        "name": "True Legacy World",
        "description": "Creating true health around the world with Kangen Water and EMF protection in 51+ countries.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://truelegacyworld.com/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is True Legacy World?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "True Legacy World is a global community for Kangen Water and EMF protection products, empowering entrepreneurs in over 51 countries to build health and legacy." 
            }
          },
          {
            "@type": "Question",
            "name": "How do I join True Legacy World?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Visit the website and use the country selector or distributor directory to connect with local leadership and become part of the community." 
            }
          }
        ]
      }
    </script>
    <div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
  </body>
</html>
