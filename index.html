<!doctype html>
<html lang="en">

<head>

  <!-- Primary Meta Tags -->

  <meta name="author" content="True Legacy World" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://truelegacyworld.com/" />
  <meta property="og:title" content="True Legacy World — Health, Wealth & Global Legacy Building" />

  <!-- Twitter -->

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />

  <!-- Canonical -->
  <link rel="canonical" href="https://truelegacyworld.com/" />
  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://flagcdn.com" />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
  <!-- Netlify Identity -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js" defer></script>
  <!-- jsVectorMap for interactive world map -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/css/jsvectormap.min.css" />

</head>

<body>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "True Legacy World",
    "url": "https://truelegacyworld.com",
    "description": "Global Enagic Kangen Water distributor network"
  }
  </script>
  <div id="root"></div>
  <!-- Netlify Forms: hidden form for pdf-lead-capture (discovered at build) -->
  <form name="pdf-lead-capture" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
    <input type="text" name="full-name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <select name="country"><option value="">Country</option></select>
    <input type="radio" name="product-interest" value="emguarde" />
    <input type="radio" name="product-interest" value="kangen" />
    <input type="radio" name="product-interest" value="both" />
    <input type="text" name="bot-field" />
  </form>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
