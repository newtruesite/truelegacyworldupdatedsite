<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Primary Meta Tags -->
    <title>True Legacy World — Health, Wealth & Global Legacy Building</title>
    <meta
      name="title"
      content="True Legacy World — Health, Wealth & Global Legacy Building"
    />
    <meta
      name="description"
      content="Join True Legacy World — the global movement led by Mehdi Cohen combining Kangen water health technology and emGuarde EMF protection with a proven entrepreneurship system. Build your legacy across 51+ countries."
    />
    <meta
      name="keywords"
      content="True Legacy World, Kangen water, emGuarde, Mehdi Cohen, financial freedom, global entrepreneurship, network marketing, alkaline water, EMF protection, Enagic, legacy building"
    />
    <meta name="author" content="True Legacy World" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="True Legacy World" />
    <meta
      property="og:image"
      content="https://truelegacyworld.com/true-legacy-world-logo-CLEAN.svg"
    />
    <meta property="og:url" content="https://truelegacyworld.com/" />
    <meta
      property="og:title"
      content="True Legacy World — Health, Wealth & Global Legacy Building"
    />
    <meta
      property="og:description"
      content="A global movement transforming lives through Kangen water, emGuarde technology, and entrepreneurship. 51+ countries. Your legacy starts here."
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://truelegacyworld.com/" />
    <meta
      property="twitter:title"
      content="True Legacy World — Health, Wealth & Global Legacy Building"
    />
    <meta
      property="twitter:description"
      content="Join the movement. Kangen water + emGuarde + proven business system = your True Legacy."
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Canonical -->
    <link rel="canonical" href="https://truelegacyworld.com/" />
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://flagcdn.com" />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />

    <!-- jsVectorMap for interactive world map -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/css/jsvectormap.min.css"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/js/jsvectormap.min.js"
      defer
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/maps/world.js"
      defer
    ></script>
  </head>

  <body>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "True Legacy World",
        "url": "https://truelegacyworld.com",
        "logo": "https://truelegacyworld.com/true-legacy-world-logo-CLEAN.svg",
        "description": "Global Enagic Kangen Water distributor network. Health, wealth and legacy building in 29+ countries.",
        "sameAs": [
          "https://www.instagram.com/truelegacyworld/",
          "https://www.tiktok.com/@mehdi_cohen"
        ]
      }
    </script>
    <div id="root"></div>
    <!-- Form for pdf-lead-capture (handled by Netlify Functions + Supabase; keeping HTML structure for progressive enhancement) -->
    <form name="pdf-lead-capture" method="POST" action="/" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="pdf-lead-capture" />
      <div hidden>
        <label>
          Don’t fill this out if you’re human: <input name="bot-field" />
        </label>
      </div>
      <input type="text" name="full-name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <select name="country">
        <option value="">Country</option>
      </select>
      <input type="text" name="pdf_requested" />
      <input type="text" name="pdf_url" />
      <input type="radio" name="product-interest" value="emguarde" />
      <input type="radio" name="product-interest" value="kangen" />
      <input type="radio" name="product-interest" value="both" />
    </form>
    <!-- Form for events-lead-capture -->
    <form name="events-lead-capture" method="POST" action="/" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="events-lead-capture" />
      <div hidden>
        <label>
          Don’t fill this out if you’re human: <input name="bot-field" />
        </label>
      </div>
      <input type="text" name="first-name" />
      <input type="text" name="last-name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="region" />
      <input type="text" name="event_title" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
